name: Trigger auto deployment for dev-gradtrack-api

on:
  push:
    branches:
      [main]
    paths:
      - 'gradtrack-api/**'
      - '.github/workflows/dev-gradtrack-api-AutoDeployTrigger-a95a4676-434e-4777-8c0d-62193beb0ffa.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/gradtrack-api
          dockerfilePath: Dockerfile
          registryUrl: devgradtrackregistry.azurecr.io
          registryUsername: ${{ secrets.DEVGRADTRACKAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DEVGRADTRACKAPI_REGISTRY_PASSWORD }}
          containerAppName: dev-gradtrack-api
          resourceGroup: DevOps
          imageToBuild: devgradtrackregistry.azurecr.io/gradtrack-api:${{ github.sha }}
          imageToDeploy: devgradtrackregistry.azurecr.io/gradtrack-api:${{ github.sha }}
          targetPort: 8080
          ingress: external
          environmentVariables: ASPNETCORE_ENVIRONMENT=Production KeyVault__VaultName=gradtrack-api-kv ASPNETCORE_URLS=http://+:8080
